name: Build Windows installer

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'electron/**'
      - 'public/**'
      - 'package.json'
      - '.github/workflows/build-windows.yml'

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Build Windows installer (NSIS .exe)
        run: npx electron-builder --win nsis --publish never
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Simorgh-Windows-Installer
          path: release/*.exe
      - name: Publish to GitHub Release (downloadable .exe)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: نسخه‌ی ویندوزِ سیمرغ (آخرین)
          body: |
            نصب‌کننده‌ی ویندوز (NSIS). فایلِ Simorgh-Setup-*.exe را دانلود و نصب کنید.
            این انتشار با هر build روی شاخه‌ی main به‌روزرسانی می‌شود.
          files: release/*.exe
          fail_on_unmatched_files: true
